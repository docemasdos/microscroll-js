<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>DOCEMASDOS diseño web y desarrollo de aplicaciones</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url(./Inter.ttf);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
          width: 100%;
          overflow-x: clip;
          background: #fff;
          color: #0d0d11;;
          font-family: system-ui, sans-serif;
      }

      /*
         CLAVE: En lugar de visibility: hidden o display: none,
         usamos opacity: 0 para forzar al navegador a renderizar
         las alturas y posiciones reales en el flujo de scroll.
      */
      .guide-group {
          position: relative;
          z-index: 1;
          opacity: 0;
          pointer-events: none;
          width: 100%;
          display: block;
      }

      .guide-group-12 {
          position: relative;
          z-index: 1;
          opacity: 0;
          pointer-events: none;
          width: 100%;
          display: block;
      }

      .guide-group section {
          display: block;
          width: 100%;
      }

      .guide-group section > div {
          width: 100%;
          display: block;
          /* Se asegura de que no colapsen los márgenes ni alturas */
          box-sizing: border-box;
      }

      /* CONTENIDOS: Flotan fijos en pantalla */
      .content-group {
          position: fixed;
          left: 0;
          top: 0;
          width: 100vw;
          height: 100vh;
          z-index: 2;
          pointer-events: auto;
          will-change: top;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .content-group-12 {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2;
        pointer-events: auto;
        will-change: top;
        display: flex;
        align-items: center;
        justify-content:space-between;
      }

      .content-group > section {
          width: 100%;
          height: 100%;
          position: relative;
      }

      .card {
          width: 100%;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          will-change: transform, opacity;
          transition: all 0.5s ease;
          h3 {
            font-weight: 300;
            font-size: 24px;
          }
      }
      #content-1 .card {
        opacity: 0;
      }
      #content-2 .card {
        opacity: 0;
        h3 {
          letter-spacing: .5em;
        }
      }
      h1 {
        font-size: 70px;
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        margin: 0 auto;
      }
      </style>
  </head>
  <body>
    <!-- ==================== ESCENA 1 ==================== -->
    <div id="guide-1" class="guide-group">
        <section>
            <div id="initial-state"
            data-step="1"
            data-anim-height="100vh"
            data-anim-name="hero-anim"
            class="anim-initial-state"
            >
                <span>opacity=`0`</span>
            </div>
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="hero-anim">
                <span>opacity=`${x}`</span>
            </div>
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="hero-anim">
                <span>letter-spacing=`${10*x}px`</span>
            </div>
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="hero-anim">
                <span>opacity=`${1-x}`</span>
            </div>
        </section>
    </div>

    <div id="content-1" class="content-group">
        <section>
            <div data-anim-name="hero-anim" class="card">
                <h3>Hola</h3>
            </div>
        </section>
    </div>
    <!-- ==================== ESCENA 2 ==================== -->
    <div id="guide-2" class="guide-group">
        <section>
            <div id="initial-state"
            data-step="1"
            data-anim-height="100vh"
            data-anim-name="feature-anim"
            class="anim-initial-state"
            >
                <span>transform=`scale(1)`</span>
                <span>opacity=`0`</span>
            </div>
            <!-- Paso 1 de la Escena 2 (entra al terminar la Escena 1) -->
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="feature-anim"
            >
                <span>opacity=`${x}`</span>
                <span>transform=`scale(${1+x*0.5})`</span>
            </div>
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="feature-anim">
                <span>opacity=`${1-x}`</span>
            </div>
        </section>
    </div>
    <div id="content-2" class="content-group">
        <section>
            <div data-anim-name="feature-anim" class="card">
                <h3>Bienvenido a...</h3>
            </div>
        </section>
    </div>
    <!-- ==================== ESCENA 2 ==================== -->
    <div id="guide-3" class="guide-group">
        <section>
            <div id="initial-state"
            data-step="1"
            data-anim-height="100vh"
            data-anim-name="feature-1-anim"
            class="anim-initial-state"
            >
                <span>opacity=`0`</span>
            </div>
            <!-- Paso 1 de la Escena 2 (entra al terminar la Escena 1) -->
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="feature-1-anim"
            >
                <span>opacity=`${Math.round(x, -1)}`</span>
            </div>
            <div data-step="1"
            data-anim-height="100vh"
            data-anim-name="feature-1-anim">
                <span>opacity=`${1-x}`</span>
            </div>
            <div data-step="1"
            data-anim-height="150vh"
            data-anim-name="feature-1-anim">
            </div>
        </section>
    </div>
    <div id="content-3" class="content-group">
        <section>
            <div data-anim-name="feature-1-anim" class="card">
                <h1>DOCE+2</h1>
            </div>
        </section>
    </div>
    <script src="microscroll.js" charset="utf-8"></script>
  </body>
</html>
