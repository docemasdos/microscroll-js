<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Microscroll.js</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
          width: 100%;
          overflow-x: clip;
          background: #0d0d11;
          color: #ffffff;
          font-family: system-ui, sans-serif;
      }

      /*
         CLAVE: En lugar de visibility: hidden o display: none,
         usamos opacity: 0 para forzar al navegador a renderizar
         las alturas y posiciones reales en el flujo de scroll.
      */
      .guide-group {
          position: relative;
          z-index: 1;
          opacity: 0;
          pointer-events: none;
          width: 100%;
          display: block;
      }

      .guide-group section {
          display: block;
          width: 100%;
      }

      .guide-group section > div {
          width: 100%;
          display: block;
          /* Se asegura de que no colapsen los márgenes ni alturas */
          box-sizing: border-box;
      }

      /* CONTENIDOS: Flotan fijos en pantalla */
      .content-group {
          position: fixed;
          left: 0;
          top: 0;
          width: 100vw;
          height: 100vh;
          z-index: 2;
          pointer-events: auto;
          will-change: top;
          display: flex;
          align-items: center;
          justify-content: center;
      }

      .content-group > section {
          width: 100%;
          height: 100%;
          position: relative;
      }

      .card {
          width: 100%;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          will-change: transform, opacity, background-color;
          transition: all 0.5s ease;
      }

      h1 { font-size: 4rem; text-transform: uppercase; }
      </style>
  </head>
  <body>
    <!-- ==================== ESCENA 1 ==================== -->
    <div id="guide-1" class="guide-group">
        <section>
          <div id="initial-state" data-step="1" data-anim-height="100vh" data-anim-name="hero-anim">
              <span>opacity=`0`</span>
          </div>
            <!-- Paso 1: Aparece (ocupa 150vh de scroll) -->
            <div data-step="1" data-anim-height="150vh" data-anim-name="hero-anim">
                <span>opacity=`${x}`</span>
            </div>
            <div data-step="1" data-anim-height="150vh" data-anim-name="hero-anim">
                <span>letter-spacing=`${10*x}px`</span>
            </div>
            <div data-step="1" data-anim-height="150vh" data-anim-name="hero-anim">
                <span>opacity=`${1-x}`</span>
            </div>
        </section>
    </div>

    <div id="content-1" class="content-group">
        <section>
            <div data-anim-name="hero-anim" class="card">
                <h1>Hola</h1>
            </div>
        </section>
    </div>
    <!-- ==================== ESCENA 2 ==================== -->
    <div id="guide-2" class="guide-group">
        <section>
            <!-- Paso 1 de la Escena 2 (entra al terminar la Escena 1) -->
            <div data-step="1" data-anim-height="400vh" data-anim-name="feature-anim">
                <span>opacity=`${x}`</span>
                <span>transform=`rotate(${x * 360}deg)`</span>
                <span>backgroundColor=`rgba(50, ${Math.round(200 * x)}, 255, 1)`</span>
            </div>
            <div id="final-state" data-step="1" data-anim-height="100vh" data-anim-name="hero-anim">
                
            </div>
        </section>
    </div>

    <div id="content-2" class="content-group">
        <section>
            <div data-anim-name="feature-anim" class="card">
                <h1>Mocroscroll</h1>
            </div>
        </section>
    </div>
    <script src="microscroll.js" charset="utf-8"></script>
  </body>
</html>
